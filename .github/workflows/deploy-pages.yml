name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build SvelteKit SPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        env:
          NODE_ENV: production
          BASE_PATH: ${{ vars.BASE_PATH || '/Sixhuma' }}
          VITE_HUB_URL: ${{ vars.VITE_HUB_URL || 'https://sixhuma-api.onrender.com' }}
        run: |
          pnpm -r --filter sixhuma-core --filter sixhuma-svelte run build
          touch sixhuma-svelte/build/.nojekyll
          if [ -f sixhuma-svelte/build/index.html ] && [ ! -f sixhuma-svelte/build/404.html ]; then
            cp sixhuma-svelte/build/index.html sixhuma-svelte/build/404.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sixhuma-svelte/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
