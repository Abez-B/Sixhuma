services:
  - type: web
    name: sixhuma-api
    env: node
    plan: free
    buildCommand: npm install -g pnpm@10.33.3 && pnpm install --frozen-lockfile && pnpm -r --filter sixhuma-core --filter sixhuma-api run build
    startCommand: node sixhuma-api/dist/index.mjs
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: '*'
